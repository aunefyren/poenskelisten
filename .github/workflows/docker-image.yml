name: Docker Image for Releases

on:
  release:
    types: [published]

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      version: ${{ github.event.release.tag_name }}
      tags: |
        type=raw,value=${{ github.event.release.tag_name }}
      latest: true
    secrets: inherit
