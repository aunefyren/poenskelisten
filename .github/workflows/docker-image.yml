name: Docker Image for Releases

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Secrets can't be used in step `if:` conditions, so expose whether the
    # Docker Hub credentials exist. Without them (e.g. on a fork) the image is
    # only published to GHCR.
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}

    steps:
    - uses: actions/checkout@v7
    - name: Set up Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ env.HAS_DOCKERHUB == 'true' && 'aunefyren/poenskelisten' || '' }}
          ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=${{ github.ref_name }}
        flavor: |
          latest=true
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to Docker Hub
      if: env.HAS_DOCKERHUB == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Replace version variable
      run:  sed -i 's/{{RELEASE_TAG}}/${{ github.event.release.tag_name }}/g' config/config.go # Replace release variable with the name of this release
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64,linux/arm/v7,linux/386
        push: true
        context: .
        tags: ${{ steps.meta.outputs.tags }}