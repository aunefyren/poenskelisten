name: Release GO binaries

on:
  release:
    types: [published]

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the binaries to the release
    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, windows/386, windows/amd64, darwin/amd64, darwin/arm64
        goos: [linux, windows]
        goarch: ["386", amd64, arm64, arm]
        exclude:
          - goarch: arm64
            goos: windows
          - goarch: arm
            goos: windows
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Keep the release token out of .git/config, where every later step
        # could read it; nothing here runs git with it.
        persist-credentials: false
    - uses: wangyoucao577/go-release-action@279495102627de7960cbc33434ab01a12bae144b # v1.55
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        goos: ${{ matrix.goos }}
        goarch: ${{ matrix.goarch }}
        goversion: "go.mod"
        binary_name: "poenskelisten"
        ldflags: "-s -w -X aunefyren/poenskelisten/config.version=${{ github.event.release.tag_name }}"
        # Only web/ (templates + static assets) is read at runtime; the Go
        # packages are compiled into the binary.
        extra_files: README.md LICENSE web
        retry: 10
        overwrite: true
        # No release_name: when it's set, go-release-action blanks the release tag,
        # which left asset names like poenskelisten--linux-amd64. On a release
        # event the tag (and target release) come from the event itself.
